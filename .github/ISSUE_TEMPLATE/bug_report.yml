name: Bug Report
description: Report a bug/crash for Among Us Revamped.
labels: ["type: bug"]

body:
  - type: markdown
    attributes:
      value: |
        **Attachments**
        - Please upload logs to help diagnose the issue (retrieved using /dump command).
        - If applicable, include screenshots or videos to provide more context.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug in detail.
      placeholder: |
        A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen.
      placeholder: |
        A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide a minimal set of steps to reproduce the issue.
      placeholder: |
        1. Step one
        2. Step two
        3. Step three
    validations:
      required: true

  - type: dropdown
    id: game-platform
    attributes:
      label: Game Platform
      description: Select the platform you are using Among Us on.
      options:
        - Steam
        - Itch.io
        - Epic Games Store
        - Microsoft Store
        - Xbox App
    validations:
      required: true

  - type: input
    id: other-mods
    attributes:
      label: Other Mods
      description: List any other Among Us mods you are using (e.g., AUnlocker v1.3.1).
    validations:
      required: false

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      description: Make sure that you have checked the following before submitting your bug report
      options:
        - label: I confirm that this issue does not occur in the vanilla game (without Among Us Revamped or BepInEx installed).
          required: true
        - label: I confirm that I have searched existing issues and this is not a duplicate.
          required: true
        - label: I confirm that I am using the latest version of Among Us Revamped and Among Us.
          required: true
